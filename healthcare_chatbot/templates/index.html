<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediBot - AI Healthcare Chatbot</title>
<style>
  :root{
    --bg:#eef4f4; --card:#ffffff; --ink:#16282b; --muted:#5c7478; --line:#d9e5e6;
    --brand:#0f8b8d; --brand-dark:#0b6b6d; --brand-soft:#e1f3f3;
    --user:#0f8b8d; --user-ink:#ffffff; --bot:#f1f6f6; --warn-bg:#fff4e5; --warn-ink:#8a4b00;
    --danger-bg:#fdeaea; --danger-line:#e5484d; --danger-ink:#8c1d21;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0d1819; --card:#142426; --ink:#e6f1f1; --muted:#8fa9ac; --line:#243b3e;
      --brand:#2bb3b6; --brand-dark:#58c9cb; --brand-soft:#173436; --user:#168f92; --bot:#1b3033;
      --warn-bg:#33270f; --warn-ink:#f1c27a; --danger-bg:#3a1618; --danger-line:#e5484d; --danger-ink:#ffb3b5; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
  .app{width:100%;max-width:820px;height:100dvh;display:flex;flex-direction:column;background:var(--card);box-shadow:0 0 40px rgba(0,0,0,.08)}
  header{padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--card)}
  .logo{width:42px;height:42px;border-radius:12px;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:22px;flex:none}
  header h1{font-size:17px;margin:0;line-height:1.2}
  header p{margin:0;color:var(--muted);font-size:12.5px}
  .spacer{flex:1}
  .btn{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;border-radius:9px;cursor:pointer;font:inherit;font-size:13px}
  .btn:hover{background:var(--brand-soft)}
  .notice{background:var(--warn-bg);color:var(--warn-ink);font-size:12.5px;padding:7px 18px;border-bottom:1px solid var(--line)}
  #chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .row{display:flex;gap:9px;max-width:100%}
  .row.user{justify-content:flex-end}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;font-size:16px;flex:none;margin-top:2px}
  .bubble{padding:10px 14px;border-radius:16px;max-width:min(86%,640px);overflow-wrap:anywhere}
  .bot .bubble{background:var(--bot);border-top-left-radius:5px}
  .user .bubble{background:var(--user);color:var(--user-ink);border-top-right-radius:5px}
  .bubble h3{margin:0 0 6px;font-size:16px;color:var(--brand-dark)}
  .bubble p{margin:0 0 7px}.bubble p:last-child{margin-bottom:0}
  .bubble .li{display:flex;gap:7px;margin:2px 0}.bubble .li i{font-style:normal;color:var(--brand)}
  .bubble em{color:var(--muted)}
  .bubble.emergency{background:var(--danger-bg);border:1.5px solid var(--danger-line);color:var(--danger-ink)}
  .bubble.emergency em{color:inherit;opacity:.85}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 0 39px}
  .chip{border:1px solid var(--brand);color:var(--brand-dark);background:transparent;border-radius:999px;padding:6px 13px;font:inherit;font-size:13.5px;cursor:pointer}
  .chip:hover{background:var(--brand);color:#fff}
  .bars{margin:8px 0 2px}
  .bar{margin:5px 0}.bar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
  .bar .track{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar .fill{height:100%;background:var(--brand);border-radius:6px}
  .typing{display:inline-flex;gap:4px;padding:4px 2px}.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
  form{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);background:var(--card)}
  input[type=text]{flex:1;padding:12px 15px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;outline:none}
  input[type=text]:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .send{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:0 20px;font:inherit;font-weight:600;cursor:pointer}
  .send:hover{background:var(--brand-dark)}.send:disabled{opacity:.5;cursor:default}
  @media (max-width:560px){ #chat{padding:12px} .bubble{max-width:92%} header p{display:none} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">⚕</div>
    <div><h1>MediBot</h1><p>AI healthcare assistant · symptom checker · health info</p></div>
    <div class="spacer"></div>
    <button class="btn" id="resetBtn" type="button">New chat</button>
  </header>
  <div class="notice">General information only - not a medical diagnosis. In an emergency call <b>112</b> or <b>108</b>.</div>
  <main id="chat" aria-live="polite"></main>
  <form id="form" autocomplete="off">
    <input type="text" id="input" placeholder="Describe how you feel, e.g. “I have fever and headache”" aria-label="Message" maxlength="500" autofocus>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>

<script>
const chat = document.getElementById('chat'), form = document.getElementById('form'),
      input = document.getElementById('input'), sendBtn = document.getElementById('send');

let sid;
try { sid = localStorage.getItem('medibot_sid'); } catch(e) {}
if (!sid) { sid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); try { localStorage.setItem('medibot_sid', sid); } catch(e) {} }

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
               .replace(/(^|[\s(])[*_]([^*_]+?)[*_](?=[\s).,!?:]|$)/g,'$1<em>$2</em>');
}
function render(md, hideNumbered){
  let html = '', lines = md.split('\n');
  for (const ln of lines){
    if (!ln.trim()) continue;
    if (hideNumbered && /^\d+\. \*\*/.test(ln)) continue;   // the bars below already show these
    if (ln.startsWith('### ')) html += '<h3>'+inline(ln.slice(4))+'</h3>';
    else if (ln.startsWith('• ')) html += '<div class="li"><i>•</i><span>'+inline(ln.slice(2))+'</span></div>';
    else if (/^\d+\. /.test(ln)) html += '<div class="li"><i>'+ln.match(/^\d+/)[0]+'.</i><span>'+inline(ln.replace(/^\d+\. /,''))+'</span></div>';
    else { html += '<p>'+inline(ln)+'</p>'; if (hideNumbered && ln.startsWith('**Possible conditions**')) html += '%%BARS%%'; }
  }
  return html;
}
function scroll(){ chat.scrollTop = chat.scrollHeight; }

function addUser(text){
  const r = document.createElement('div'); r.className = 'row user';
  r.innerHTML = '<div class="bubble">'+esc(text)+'</div>'; chat.appendChild(r); scroll();
}
function addBot(data){
  document.querySelectorAll('.chips').forEach(c => c.remove());
  const r = document.createElement('div'); r.className = 'row bot';
  let bars = '';
  if (data.conditions && data.conditions.length){
    bars = '<div class="bars">' + data.conditions.map(c =>
      '<div class="bar"><div class="t"><span>'+esc(c.name)+'</span><b>'+Math.round(c.probability*100)+'%</b></div>' +
      '<div class="track"><div class="fill" style="width:'+Math.round(c.probability*100)+'%"></div></div></div>').join('') + '</div>';
  }
  r.innerHTML = '<div class="avatar">⚕</div><div class="bubble'+(data.emergency?' emergency':'')+'">'+(function(){ const h = render(data.reply, !!(data.conditions && data.conditions.length)); return h.includes('%%BARS%%') ? h.replace('%%BARS%%', bars) : h + bars; })()+'</div>';
  chat.appendChild(r);
  const tall = r.offsetHeight > chat.clientHeight * 0.7;
  if (data.quick_replies && data.quick_replies.length){
    const c = document.createElement('div'); c.className = 'chips';
    data.quick_replies.forEach(q => { const b = document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=q; b.onclick=()=>send(q); c.appendChild(b); });
    chat.appendChild(c);
  }
  if (tall) r.scrollIntoView({block:'start'}); else scroll();
}
function typing(on){
  const old = document.getElementById('typing'); if (old) old.remove();
  if (!on) return;
  const r = document.createElement('div'); r.className='row bot'; r.id='typing';
  r.innerHTML = '<div class="avatar">⚕</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
  chat.appendChild(r); scroll();
}
async function send(text){
  text = (text || '').trim(); if (!text) return;
  document.querySelectorAll('.chips').forEach(c => c.remove());
  addUser(text); input.value = ''; sendBtn.disabled = true; typing(true);
  try {
    const res = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({session_id: sid, message: text})});
    const data = await res.json();
    await new Promise(r => setTimeout(r, 350));
    typing(false); addBot(data);
  } catch(e){
    typing(false); addBot({reply:'Sorry, I could not reach the server. Please check that the app is running and try again.', quick_replies:[]});
  }
  sendBtn.disabled = false; input.focus();
}
form.addEventListener('submit', e => { e.preventDefault(); send(input.value); });
document.getElementById('resetBtn').onclick = async () => {
  await fetch('/api/reset', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({session_id: sid})}).catch(()=>{});
  chat.innerHTML = ''; welcome();
};
function welcome(){
  addBot({reply:"Hello! I'm **MediBot**, your AI health assistant. 👋\nTell me how you are feeling and I'll ask a few questions, suggest what it could be, and tell you when to see a doctor.\n\nI can also explain diseases, give precautions, suggest the right specialist and calculate your BMI.",
          quick_replies:["I have fever and headache","I have cough and sore throat","What is dengue?","Calculate BMI","Health tips"]});
}
welcome();
</script>
</body>
</html>
